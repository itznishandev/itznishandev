<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Nuruzzaman Nishan — Full-stack web, Flutter, SaaS and AI-driven developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#0d1a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .float { animation: float 7s ease-in-out infinite; }
      .float2 { animation: float 9s ease-in-out infinite reverse; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .rise { animation: rise .8s ease-out both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)" opacity="0.6"/>
    <circle class="float" cx="980" cy="90" r="220" fill="url(#glowA)"/>
    <circle class="float2" cx="1120" cy="300" r="180" fill="url(#glowB)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
    <rect x="-300" y="0" width="300" height="3" fill="#ffffff" opacity="0.7">
      <animate attributeName="x" from="-300" to="1200" dur="4s" repeatCount="indefinite"/>
    </rect>
    <g fill="#93c5fd">
      <circle cx="720" cy="60" r="2" opacity="0.6"><animate attributeName="cy" values="60;40;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="300" r="1.5" opacity="0.5"><animate attributeName="cy" values="300;275;300" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="40" r="2" opacity="0.5"><animate attributeName="cy" values="40;60;40" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="250" r="1.5" opacity="0.5"><animate attributeName="cx" values="760;780;760" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.6;0.1" dur="9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Left: identity -->
    <g class="rise d1">
      <rect x="64" y="56" width="214" height="28" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <circle class="pulse" cx="82" cy="70" r="5" fill="#22c55e"/>
      <text x="96" y="75" class="t" font-size="13" fill="#cbd5e1" font-weight="600">Open to work &amp; freelance</text>
    </g>

    <text x="64" y="146" class="t rise d2" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-1">Nuruzzaman Nishan</text>

    <g class="rise d3">
      <text x="64" y="190" class="t" font-size="22" font-weight="600" fill="url(#accent)">Full-Stack Web · Flutter Apps · SaaS · AI-Driven</text>
    </g>

    <g class="rise d4">
      <text x="64" y="232" class="m" font-size="15" fill="#64748b"><tspan fill="#38bdf8">~/bangladesh</tspan><tspan fill="#94a3b8"> $ </tspan><tspan fill="#e2e8f0">build --web --android --with-ai </tspan><tspan class="blink" fill="#38bdf8">▍</tspan></text>

      <g class="t" font-size="13" font-weight="600">
        <rect x="64" y="262" width="96" height="30" rx="8" fill="#111c33" stroke="#1e3a8a"/>
        <text x="112" y="282" text-anchor="middle" fill="#93c5fd">Next.js</text>
        <rect x="170" y="262" width="96" height="30" rx="8" fill="#111c33" stroke="#1e3a8a"/>
        <text x="218" y="282" text-anchor="middle" fill="#93c5fd">TypeScript</text>
        <rect x="276" y="262" width="82" height="30" rx="8" fill="#0c2233" stroke="#0e7490"/>
        <text x="317" y="282" text-anchor="middle" fill="#67e8f9">Flutter</text>
        <rect x="368" y="262" width="70" height="30" rx="8" fill="#0c2233" stroke="#0e7490"/>
        <text x="403" y="282" text-anchor="middle" fill="#67e8f9">Dart</text>
        <rect x="448" y="262" width="70" height="30" rx="8" fill="#1d1336" stroke="#6d28d9"/>
        <text x="483" y="282" text-anchor="middle" fill="#c4b5fd">SaaS</text>
        <rect x="528" y="262" width="104" height="30" rx="8" fill="#1d1336" stroke="#6d28d9"/>
        <text x="580" y="282" text-anchor="middle" fill="#c4b5fd">AI Agents</text>
      </g>
    </g>

    <!-- Right: code card -->
    <g transform="translate(790 70)"><g class="float2">
      <rect width="350" height="206" rx="14" fill="#0b1220" fill-opacity="0.92" stroke="#1f2a44"/>
      <circle cx="22" cy="22" r="5.5" fill="#ef4444"/>
      <circle cx="40" cy="22" r="5.5" fill="#f59e0b"/>
      <circle cx="58" cy="22" r="5.5" fill="#22c55e"/>
      <text x="330" y="27" text-anchor="end" class="m" font-size="11" fill="#475569">nishan.ts</text>
      <line x1="0" y1="42" x2="350" y2="42" stroke="#1f2a44"/>
      <g class="m" font-size="13">
        <text x="22" y="70"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> dev = {</tspan></text>
        <text x="40" y="94"><tspan fill="#7dd3fc">web</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Next.js + TS"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="40" y="118"><tspan fill="#7dd3fc">mobile</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Flutter"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="40" y="142"><tspan fill="#7dd3fc">ai</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"agents + APIs"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="40" y="166"><tspan fill="#7dd3fc">builds</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"SaaS + bots"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="22" y="190" fill="#e2e8f0">}; <tspan fill="#64748b">// always shipping</tspan></text>
      </g>
    </g></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#1e293b"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
